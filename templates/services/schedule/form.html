{% extends "dashboard/base.html" %}

{% block title %}Programar Servicio{% endblock %}
{% block page_title %}Programar Servicio{% endblock %}

{% block dashboard_content %}
<div class="mb-6">
    <a href="{% url 'services:calendar' %}" class="text-xs text-gray hover:text-black"><i class="fa-solid fa-arrow-left mr-1"></i>Calendario</a>
</div>

<div class="max-w-md bg-white border border-light-gray rounded">
    <div class="px-6 py-4 border-b border-light-gray">
        <h3 class="text-sm font-medium text-black uppercase tracking-wider">Programar Servicio</h3>
    </div>
    <form method="POST" class="p-6 space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-medium text-gray uppercase tracking-wider mb-2">Tipo de Servicio *</label>
            <select name="service_type" required class="w-full border-b-2 border-black p-2 focus:outline-none text-sm bg-transparent">
                {% for stype in service_types %}
                <option value="{{ stype.id }}">{{ stype.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray uppercase tracking-wider mb-2">Fecha *</label>
            <input type="date" name="date" value="{{ today }}" required
                   class="w-full border-b-2 border-black p-2 focus:outline-none text-sm bg-transparent">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray uppercase tracking-wider mb-2">Hora inicio</label>
                <input type="time" name="start_time"
                       class="w-full border-b-2 border-black p-2 focus:outline-none text-sm bg-transparent">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray uppercase tracking-wider mb-2">Hora fin</label>
                <input type="time" name="end_time"
                       class="w-full border-b-2 border-black p-2 focus:outline-none text-sm bg-transparent">
            </div>
        </div>
        <div>
            <label class="block text-xs font-medium text-gray uppercase tracking-wider mb-2">Título especial</label>
            <input type="text" name="title" placeholder="Solo si es diferente al nombre del tipo"
                   class="w-full border-b-2 border-black p-2 focus:outline-none text-sm bg-transparent">
        </div>
        <div>
            <label class="block text-xs font-medium text-gray uppercase tracking-wider mb-2">Notas</label>
            <textarea name="notes" rows="2" class="w-full border border-light-gray p-2 focus:outline-none text-sm resize-none"></textarea>
        </div>
        <div class="flex items-center gap-3 pt-4 border-t border-light-gray">
            <button type="submit" class="px-6 py-2.5 bg-primary text-white text-sm hover:bg-primary-dark transition-colors">Programar</button>
            <a href="{% url 'services:calendar' %}" class="px-6 py-2.5 border border-black text-black text-sm hover:bg-black hover:text-white transition-colors">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
